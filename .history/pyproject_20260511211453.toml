[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ae-picker"
version = "0.2.1"
description = "First-arrival time picking for acoustic emission and microseismic waveforms"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "Daniel Wamriew", email = "wamriewdan@gmail.com" },
]
requires-python = ">=3.9"
keywords = [
  "acoustic emission",
  "microseismic",
  "signal processing",
  "arrival picking",
  "seismology",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=1.5",
  "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
  "build",
  "jupyter",
  "nbconvert",
  "twine",
]
obspy = [
  "obspy",
]

[project.scripts]
ae-picker = "ae_picker.cli:main"

[project.urls]
Homepage = "https://github.com/wamriewdan/ae_arrival_picker"
Repository = "https://github.com/wamriewdan/ae_arrival_picker"
Issues = "https://github.com/wamriewdan/ae_arrival_picker/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ae_picker*"]
