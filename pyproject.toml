[build-system]
requires      = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name        = "ae_picker"
version     = "0.1.0"
description = "First-arrival time picking for acoustic emission and microseismic waveforms"
readme      = "README.md"
license     = { text = "MIT" }
requires-python = ">=3.9"

dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["jupyter", "nbconvert"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ae_picker*"]
